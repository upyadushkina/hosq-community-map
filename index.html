<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

      font-family: 'Lexend';
      src: url('../Lexend-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Lexend';
      src: url('../Lexend-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    :root {
      --page-bg: #3B3033;
      --page-text: #EAE2D6;
      --accent: #F4A8B3;
      --muted: #5C5255;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: var(--page-bg);
      color: var(--page-text);
      font-family: 'Lexend', sans-serif;
      font-weight: 500;
      overflow: hidden;
    }

    .layout {
      display: grid;
      width: 100vw;
      height: 100vh;
    }

    .content {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
      display: block;
      background: var(--page-bg);
      touch-action: none;
    }

    svg:active { cursor: grabbing; }

    .land {
      stroke: #2C2426;
      stroke-width: 0.6px;
      vector-effect: non-scaling-stroke;
    }

    .graticule {
      fill: none;
      stroke: rgba(234, 226, 214, 0.08);
      stroke-width: 0.6px;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .sphere {
      fill: none;
      stroke: rgba(234, 226, 214, 0.16);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .arc {
      fill: none;
      stroke: #F4A8B3;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .node { cursor: pointer; }

    .node-label, .country-label {
      fill: #EAE2D6;
      font-family: 'Lexend', sans-serif;
      font-weight: 500;
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: #3B3033;
      stroke-linejoin: round;
    }

    .top-btn {
      padding: 8px 16px;
      background-color: var(--muted);
      color: var(--page-text);
      border: none;
      outline: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Lexend', sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    .top-btn:hover,
    .top-btn:focus,
    .top-btn:active {
      background-color: var(--accent);
      color: var(--muted);
      border: none;
      outline: none;
    }

    .top-left-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 200;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      max-width: calc(100vw - 180px);
    }

    .top-right-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      height: 30px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    #search-input {
      width: 180px;
      padding: 8px 12px;
      background-color: var(--muted);
      border: none;
      outline: none;
      border-radius: 6px;
      color: var(--page-text);
      font-size: 14px;
      font-family: inherit;
      min-width: 0;
    }

    #search-input::placeholder { color: var(--page-text); opacity: 1; }
    #search-input:focus { outline: none; background-color: var(--muted); }

    .legend {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 200;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      max-width: min(720px, calc(100vw - 90px));
      pointer-events: none;
      align-items: center;
    }

    .legend-count, .legend-live {
      font-size: 12px;
      color: var(--page-text);
    }

    .legend-live.error { color: var(--accent); }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--page-text);
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .zoom-controls {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .zoom-controls .top-btn {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 8px;
    }

    .unplaced {
      position: absolute;
      top: 72px;
      right: 16px;
      z-index: 200;
      width: min(220px, 46vw);
      max-height: 36vh;
      overflow: auto;
      display: none;
    }

    .unplaced.visible { display: block; }

    .unplaced-title {
      font-size: 12px;
      margin-bottom: 6px;
      color: var(--page-text);
    }

    .unplaced button {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 4px;
      padding: 6px 10px;
      background: var(--muted);
      color: var(--page-text);
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .unplaced button:hover,
    .unplaced button:focus {
      background: var(--accent);
      color: var(--muted);
      outline: none;
    }

    .filters-backdrop {
      position: fixed;
      inset: 0;
      background: transparent;
      z-index: 299;
      display: none;
    }

    .filters-backdrop.active { display: block; }

    .filters-popup {
      position: fixed;
      top: 80px;
      left: 16px;
      background-color: var(--page-bg);
      border-radius: 8px;
      z-index: 300;
      display: none;
      width: 320px;
      max-height: calc(100vh - 100px);
      overflow: hidden;
      font-family: 'Lexend', sans-serif;
      font-weight: 500;
    }

    .filters-popup.active { display: block; }

    .filters-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }

    .filters-popup-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      color: var(--page-text);
    }

    .close-filters-btn {
      background: none;
      border: none;
      color: var(--page-text);
      font-size: 28px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      padding: 0;
      line-height: 1;
    }

    .close-filters-btn:hover,
    .close-filters-btn:focus {
      background-color: var(--accent);
      color: var(--muted);
      outline: none;
    }

    .filters-popup-content {
      padding: 0 20px 20px;
      overflow-y: auto;
      max-height: calc(80vh - 70px);
    }

    .filter-group { margin-bottom: 24px; }

    .filter-group h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--page-text);
    }

    .filter-options { display: flex; flex-wrap: wrap; gap: 8px; }

    .filter-tag {
      background-color: var(--muted);
      color: var(--page-text);
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
    }

    .filter-tag.active,
    .filter-tag.active:hover {
      background-color: var(--accent);
      color: var(--muted);
    }

    .popup {
      position: absolute;
      background-color: var(--page-bg);
      color: var(--page-text);
      padding: 12px;
      border-radius: 8px;
      z-index: 250;
      width: max-content;
      max-width: min(280px, 80vw);
      text-align: center;
      font-size: 14px;
      font-family: 'Lexend', sans-serif;
      font-weight: 500;
      user-select: text;
      pointer-events: auto;
      display: none;
    }

    .popup.popup-feature { width: max-content; max-width: min(280px, 80vw); padding: 8px 12px; }
    .popup.popup-project { width: 260px; max-width: min(260px, 80vw); padding: 12px; }

    .popup-wrap {
      position: absolute;
      z-index: 250;
      display: none;
      padding: 50px;
      pointer-events: none;
      box-sizing: content-box;
    }

    .popup-wrap.active { display: block; }

    .popup-wrap .popup {
      position: relative;
      left: auto;
      top: auto;
      display: block;
      pointer-events: auto;
    }

    .popup img {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .popup .card-title {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
      color: var(--page-text);
    }

    .popup .card-meta { color: var(--page-text); font-size: 12px; margin-bottom: 2px; }
    .popup .card-role { color: var(--accent); margin: 4px 0 6px; }

    .popup .card-row {
      margin: 4px 0;
      text-align: left;
      font-size: 12px;
      line-height: 1.4;
      color: #EAE2D6;
    }

    .popup .card-row .label { color: #5C5255; }
    .popup .card-tag, .popup .card-sep { color: #EAE2D6; text-decoration: none; }
    .popup .card-tag { cursor: pointer; }
    .popup .card-tag:hover, .popup .card-tag:focus { color: #F4A8B3; outline: none; }

    .popup .project-description {
      margin: 8px 0;
      color: #EAE2D6;
      font-size: 12px;
      line-height: 1.45;
      text-align: left;
      font-weight: 400;
    }

    .popup .curator-link { color: #EAE2D6; cursor: pointer; text-decoration: none; }
    .popup .curator-link:hover, .popup .curator-link:focus { color: #F4A8B3; outline: none; }

    .popup .connect-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #F4A8B3;
      color: #5C5255;
      border: none;
      border-radius: 999px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }

    .popup .connect-btn:hover, .popup .connect-btn:focus {
      background-color: #EAE2D6;
      color: #5C5255;
      outline: none;
    }

    .popup .telegram-row { margin-top: 8px; font-size: 12px; text-align: left; color: #EAE2D6; }
    .popup .telegram-link { color: #F4A8B3; text-decoration: none; }
    .popup .telegram-link:hover, .popup .telegram-link:focus { text-decoration: underline; outline: none; }

    @media (max-width: 768px) {
      .top-left-controls { flex-direction: column; align-items: flex-start; max-width: calc(100vw - 120px); }
      .top-btn { font-size: 13px; padding: 8px 12px; }
      .filters-popup {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90vw;
        max-width: 400px;
        max-height: 80vh;
      }
    }
  </style>
</head>

    const filtersEl = document.getElementById('filters');
    const filtersPopup = document.getElementById('filters-popup');
    const filtersBackdrop = document.getElementById('filters-backdrop');

    let world = null;
    let featureById = new Map();
    let people = [];
    let personById = new Map();
    let nodes = [];
    let arcs = [];
    let countryMarks = [];
    let projection = null;
    let path = null;
    let zoom = null;
    let width = 0;
    let height = 0;
    let lastSig = null;
    let statusText = 'loading the sheet…';
    let statusError = false;
    let hoverPersonId = null;
    let pinnedPersonId = null;
    let popupAnchor = null;
    let popupKind = null;
    let tagFocus = null;
    let selectedFilters = {};
    let searchQuery = '';
    let cachedMatchCount = 0;
    let hoveringPopup = false;
    let hoveringNode = false;
    let hidePopupTimer = null;
    let viewReady = false;
    let refreshTimer = null;
    let refreshing = false;

    const openedAsFullscreen = new URLSearchParams(window.location.search).has('fullscreen');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateFullscreenButtonText() {
      fullscreenBtn.textContent = isFullscreen() ? 'exit full screen' : 'full screen';
    }

    function toggleFullscreen() {
      if (openedAsFullscreen) {
        window.close();
        return;
      }
      if (isFullscreen()) {
        if (document.exitFullscreen) document.exitFullscreen();
        return;
      }
      const docElm = document.documentElement;
      if (docElm.requestFullscreen) {
        docElm.requestFullscreen().then(updateFullscreenButtonText).catch(() => {
          const url = new URL(window.location.href);
          url.searchParams.set('fullscreen', '1');
          window.open(url.toString(), '_blank');
        });
      }
    }

    if (openedAsFullscreen) fullscreenBtn.textContent = 'exit full screen';
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenButtonText);

    document.getElementById('filters-btn').addEventListener('click', () => {
      filtersPopup.classList.add('active');
      filtersBackdrop.classList.add('active');
    });
    document.getElementById('close-filters').addEventListener('click', closeFilters);
    filtersBackdrop.addEventListener('click', closeFilters);
    document.getElementById('reset-filters').addEventListener('click', resetFilters);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeFilters();
        clearFocus();
      }
    });

    function closeFilters() {
      filtersPopup.classList.remove('active');
      filtersBackdrop.classList.remove('active');
    }

    function norm(s) {
      return String(s || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function splitCsvTags(raw) {
      if (!raw) return [];
      return String(raw).split(',').map(s => s.trim()).filter(Boolean);
    }

    function normalizeRoleLabel(role) {
      if (!role) return '';
      const cleaned = String(role).trim();
      if (cleaned.toLowerCase() === 'volunteer / participant') return "curator's helper";
      return cleaned;
    }

    function formatRoleDisplay(role) {
      if (!role) return '';
      return String(role).split(',').map(p => normalizeRoleLabel(p.trim())).filter(Boolean).join(', ');
    }

    function roleKeys(person) {
      return splitCsvTags(person.role).map(r => normalizeRoleLabel(r).toLowerCase()).filter(Boolean);
    }

    function getPrimaryRoleKey(person) {
      const roles = roleKeys(person);
      for (const key of ROLE_PRIORITY) {
        if (roles.includes(key)) return key;
      }
      return roles[0] || 'artist';
    }

    function personColor(person) {
      return ROLE_PERSON_COLORS[getPrimaryRoleKey(person)] || '#5C5255';
    }

    function decodeAt(text) {
      return typeof text === 'string' ? text.replaceAll('&#64;', '@').replaceAll('&amp;#64;', '@') : '';
    }

    function parseContactField(raw) {
      const decoded = decodeAt(raw || '').trim();
      if (!decoded) return null;
      if (decoded.startsWith('(+')) {
        const phone = decoded.replace(/[()]/g, '');
        if (!phone) return null;
        return { type: 'phone', label: 'Phone:', display: phone, href: 'tel:' + phone };
      }
      const handle = decoded.replace(/^@+/, '');
      if (!handle) return null;
      return { type: 'telegram', label: 'Telegram:', display: '@' + handle, href: 'https://t.me/' + encodeURIComponent(handle) };
    }

    function photoSrc(url) {
      const raw = String(url || '').trim();
      if (!raw) return '';
      const file = raw.match(/\/file\/d\/([^/?#]+)/) || raw.match(/[?&]id=([^&#]+)/);
      if (file) return 'https://drive.google.com/thumbnail?id=' + file[1] + '&sz=w640';
      return raw;
    }

    const EXTRA_IDS = {
      armenai: '51',
      italia: '380',
      berlin: '276',
      russian: '643',
      armenian: '51',
      mexican: '484'
    };

    const SKIP_PLACES = new Set([
      'yerevan', 'gyumri', 'abovyan', 'vanadzor', 'lori', 'toumanian', 'tumanian',
      'tbilisi', 'tehran', 'napoli', 'naples', 'shanghai', 'metz', 'moscow', 'perm',
      'london', 'ramat gan'
    ]);

    function idsForToken(token) {
      const n = norm(token);
      if (!n || SKIP_PLACES.has(n)) return [];
      if (ALIAS_IDS[n]) return [ALIAS_IDS[n]];
      if (ISO[n]) return [ISO[n]];
      if (EXTRA_IDS[n]) return [EXTRA_IDS[n]];
      const words = n.split(' ').filter(word => word && !SKIP_PLACES.has(word));
      const ids = [];
      words.forEach(word => {
        const id = ALIAS_IDS[word] || ISO[word] || EXTRA_IDS[word];
        if (id) ids.push(id);
      });
      return ids;
    }

    function countryIdsFromRaw(raw) {
      const text = String(raw || '').trim();
      if (!text) return [];
      const chunks = [];
      const pushPieces = (value) => {
        String(value || '').split(/\s*(?:\/|,|&|\band\b)\s*/i).forEach(part => {
          const piece = part.trim();
          if (piece) chunks.push(piece);
        });
      };
      const withoutParens = text.replace(/\(([^)]*)\)/g, (_, inner) => {
        pushPieces(inner);
        return ' ';
      });
      pushPieces(withoutParens);
      const ids = [];
      const seen = new Set();
      chunks.forEach(chunk => {
        idsForToken(chunk).forEach(id => {
          if (seen.has(id)) return;
          seen.add(id);
          ids.push(id);
        });
      });
      return ids;
    }

    function cellValue(cell) {
      if (!cell || cell.v == null || cell.v === '') return '';
      return String(cell.v).trim();
    }

    function findCol(headers, candidates) {
      const normed = headers.map(norm);
      for (const candidate of candidates) {
        const i = normed.indexOf(norm(candidate));
        if (i >= 0) return i;
      }
      return -1;
    }

    function parseSheet(resp) {
      const cols = (resp.table && resp.table.cols) || [];
      const headers = cols.map(col => (col.label || '').trim());
      const idx = {
        legal: findCol(headers, ['name']),
        artistic: findCol(headers, ['artistic name']),
        photo: findCol(headers, ['photo url', 'photo']),
        role: findCol(headers, ['role']),
        projects: findCol(headers, ['projects']),
        country: findCol(headers, ['country']),
        social: findCol(headers, ['social media', 'social']),
        telegram: findCol(headers, ['telegram']),
        email: findCol(headers, ['email']),
        project: findCol(headers, ['project', 'youth camp artist']),
        discipline: findCol(headers, ['discipline', 'disciplines']),
        tools: findCol(headers, ['tools']),
        skill: findCol(headers, ['skill set', 'skills']),
        instruments: findCol(headers, ['instruments'])
      };
      const seen = new Map();
      const list = [];
      ((resp.table && resp.table.rows) || []).forEach((row, rowIndex) => {
        const cells = row.c || [];
        const get = (i) => i < 0 ? '' : cellValue(cells[i]);
        const legal = get(idx.legal);
        const artistic = get(idx.artistic);
        if (!legal && !artistic) return;
        const base = (legal || artistic).trim();
        const count = (seen.get(base) || 0) + 1;
        seen.set(base, count);
        const id = 'artist::' + base + (count > 1 ? '::' + rowIndex : '');
        const countryRaw = get(idx.country);
        const places = countryIdsFromRaw(countryRaw).map(cid => ({
          id: cid,
          name: NAME_BY_ID[cid] || cid
        }));
        const projectRaw = get(idx.project) || get(idx.projects);
        const person = {
          id,
          name: artistic || legal,
          legal_name: legal,
          photo: photoSrc(get(idx.photo)),
          role: get(idx.role),
          projects: get(idx.projects),
          project: projectRaw,
          country: countryRaw,
          social: get(idx.social),
          telegram: get(idx.telegram),
          email: get(idx.email),
          discipline: get(idx.discipline),
          tools: get(idx.tools),
          instruments: get(idx.instruments),
          'skill set': get(idx.skill),
          places
        };
        person.tags = {
          role: new Set(roleKeys(person).map(r => {
            const match = splitCsvTags(person.role).map(normalizeRoleLabel).find(label => label.toLowerCase() === r);
            return match || r;
          })),
          project: new Set(splitCsvTags(person.project)),
          country: new Set(places.map(p => p.name)),
          discipline: new Set(splitCsvTags(person.discipline)),
          tools: new Set(splitCsvTags(person.tools)),
          'skill set': new Set(splitCsvTags(person['skill set']))
        };
        if (person.instruments) person.tags.instruments = new Set(splitCsvTags(person.instruments));
        list.push(person);
      });
      return list;
    }

    function countryPoint(id) {
      if (ANCHORS[id]) return ANCHORS[id];
      const feature = featureById.get(id);
      if (!feature) return null;
      const c = d3.geoCentroid(feature);
      if (!c || !isFinite(c[0]) || !isFinite(c[1])) return null;
      return c;
    }

    function layoutPeople() {
      nodes = [];
      arcs = [];
      const byCountry = new Map();
      people.forEach(person => {
        person.places.forEach(place => {
          if (!byCountry.has(place.id)) byCountry.set(place.id, []);
          byCountry.get(place.id).push({ person, place });
        });
      });

      byCountry.forEach((members, cid) => {
        const anchor = countryPoint(cid);
        if (!anchor) {
          members.forEach(m => { m.unplaced = true; });
          return;
        }
        members.sort((a, b) => a.person.name.localeCompare(b.person.name) || a.person.id.localeCompare(b.person.id));
        const n = members.length;
        const spread = Math.min(3.1, 0.46 * Math.sqrt(n));
        const golden = Math.PI * (3 - Math.sqrt(5));
        members.forEach((member, i) => {
          const t = n === 1 ? 0 : Math.sqrt((i + 0.5) / n);
          const r = spread * t;
          const a = i * golden;
          const lat = anchor[1] + r * Math.sin(a);
          const lon = anchor[0] + (r * Math.cos(a)) / Math.max(0.25, Math.cos(anchor[1] * Math.PI / 180));
          const projected = projection([lon, lat]);
          if (!projected) return;
          nodes.push({
            id: member.person.id + '@' + cid,
            personId: member.person.id,
            label: member.person.name,
            countryId: cid,
            countryName: member.place.name,
            lon, lat,
            x: projected[0],
            y: projected[1],
            color: personColor(member.person)
          });
        });
      });

      const nodeByPersonCountry = new Map();
      nodes.forEach(node => nodeByPersonCountry.set(node.personId + '@' + node.countryId, node));
      people.forEach(person => {
        for (let i = 0; i < person.places.length - 1; i++) {
          const a = nodeByPersonCountry.get(person.id + '@' + person.places[i].id);
          const b = nodeByPersonCountry.get(person.id + '@' + person.places[i + 1].id);
          if (!a || !b) continue;
          const interp = d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]);
          const coordinates = d3.range(0, 1.0001, 0.035).map(interp);
          arcs.push({ personId: person.id, d: path({ type: 'LineString', coordinates }) });
        }
      });

      countryMarks = [];
      byCountry.forEach((members, cid) => {
        const group = nodes.filter(n => n.countryId === cid);
        if (!group.length) return;
        countryMarks.push({
          id: cid,
          name: NAME_BY_ID[cid] || members[0].place.name,
          x: d3.mean(group, d => d.x),
          y: d3.min(group, d => d.y)
        });
      });
    }

    function personPassesFilters(person) {
      for (const [cat, vals] of Object.entries(selectedFilters)) {
        if (!vals || !vals.size) continue;
        const tags = person.tags[cat] || new Set();
        let ok = false;
        vals.forEach(v => { if (tags.has(v)) ok = true; });
        if (!ok) return false;
      }
      return true;
    }

    function recomputeMatchCount() {
      const q = searchQuery.trim();
      if (!q) {
        cachedMatchCount = 0;
        return;
      }
      cachedMatchCount = people.filter(p => personPassesFilters(p) && personMatches(p, q)).length;
    }

    function shown(person) {
      if (!person || !personPassesFilters(person)) return false;
      if (tagFocus) {
        const tags = person.tags[tagFocus.cat] || new Set();
        if (!tags.has(tagFocus.value)) return false;
      }
      const q = searchQuery.trim();
      if (q && cachedMatchCount > 0 && !personMatches(person, q)) return false;
      return true;
    }

    function personMatches(person, query) {
      const score = searchScore(person, query);
      return score >= 45;
    }

    function normalizeSearchText(s) {
      return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function levenshtein(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const prev = new Array(b.length + 1);
      const curr = new Array(b.length + 1);
      for (let j = 0; j < prev.length; j++) prev[j] = j;
      for (let i = 1; i <= a.length; i++) {
        curr[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
        }
        for (let j = 0; j < prev.length; j++) prev[j] = curr[j];
      }
      return prev[b.length];
    }

    function similarityRatio(a, b) {
      const maxLen = Math.max(a.length, b.length);
      if (!maxLen) return 0;
      return 1 - (levenshtein(a, b) / maxLen);
    }

    function fuzzyScore(query, candidate) {
      const q = normalizeSearchText(query);
      const c = normalizeSearchText(candidate);
      if (!q || !c) return 0;
      if (c === q) return 100;
      if (c.includes(q)) return 92 - Math.min(12, Math.max(0, c.length - q.length));
      if (q.includes(c) && c.length >= 3) return 82;
      const tokens = c.split(' ').filter(Boolean);
      if (tokens.some(t => t.startsWith(q))) return 88;
      if (tokens.some(t => q.startsWith(t) && t.length >= 3)) return 80;
      let best = similarityRatio(q, c);
      tokens.forEach(t => { best = Math.max(best, similarityRatio(q, t)); });
      if (best >= 0.82) return Math.round(75 + best * 20);
      if (best >= 0.7) return Math.round(60 + best * 15);
      if (best >= 0.55) return Math.round(40 + best * 20);
      return 0;
    }

    function searchScore(person, query) {
      const fields = [
        person.name, person.legal_name, person.role, formatRoleDisplay(person.role),
        person.country, person.project, person.projects, person.discipline, person.tools,
        person.instruments, person['skill set'], decodeAt(person.telegram || ''), person.email, person.social
      ];
      person.places.forEach(p => fields.push(p.name));
      let best = 0;
      fields.forEach((field, idx) => {
        const score = fuzzyScore(query, field);
        if (!score) return;
        const boosted = score + (idx < 2 && score >= 45 ? 4 : 0);
        if (boosted > best) best = boosted;
      });
      return Math.min(100, best);
    }

    function opacityFor(node) {
      const person = personById.get(node.personId);
      if (!person || !personPassesFilters(person)) return 0;
      if (tagFocus) {
        const tags = person.tags[tagFocus.cat] || new Set();
        if (!tags.has(tagFocus.value)) return 0.12;
      }
      const q = searchQuery.trim();
      if (q && cachedMatchCount > 0 && !personMatches(person, q)) return 0.18;
      if (hoverPersonId && node.personId !== hoverPersonId) return 0.34;
      return 1;
    }

    function arcOpacity(arc) {
      const person = personById.get(arc.personId);
      if (!person || !personPassesFilters(person)) return 0;
      if (hoverPersonId === arc.personId || pinnedPersonId === arc.personId) return 0.95;
      if (tagFocus) {
        const tags = person.tags[tagFocus.cat] || new Set();
        if (!tags.has(tagFocus.value)) return 0.04;
      }
      const q = searchQuery.trim();
      if (q && cachedMatchCount > 0 && !personMatches(person, q)) return 0.05;
      return 0.42;
    }

    function fitProjection() {
      const node = svg.node();
      width = node.clientWidth || window.innerWidth;
      height = node.clientHeight || window.innerHeight;
      projection = d3.geoNaturalEarth1();
      path = d3.geoPath(projection);
      projection.fitExtent([[12, 12], [width - 12, height - 12]], { type: 'Sphere' });
    }

    function zoomTo(lon, lat, k) {
      const p = projection([lon, lat]);
      if (!p) return;
      const t = d3.zoomIdentity.translate(width / 2 - p[0] * k, height / 2 - p[1] * k).scale(k);
      svg.call(zoom.transform, t);
    }

    function currentView() {
      const t = d3.zoomTransform(svg.node());
      const ll = projection.invert([(width / 2 - t.x) / t.k, (height / 2 - t.y) / t.k]);
      if (!ll || !isFinite(ll[0]) || !isFinite(ll[1])) return { lon: 42, lat: 46, k: t.k || 2.6 };
      return { lon: ll[0], lat: ll[1], k: t.k };
    }

    function renderMap(options) {
      const keepView = options && options.keepView && viewReady;
      const view = keepView ? currentView() : null;
      fitProjection();
      layoutPeople();

      svg.selectAll('*').remove();
      const g = svg.append('g');
      g.append('path').attr('class', 'sphere').datum({ type: 'Sphere' });
      g.append('path').attr('class', 'graticule').datum(d3.geoGraticule()());
      g.append('g').attr('class', 'lands');
      g.append('g').attr('class', 'arcs');
      g.append('g').attr('class', 'nodes');
      g.append('g').attr('class', 'node-labels');
      g.append('g').attr('class', 'country-labels');

      if (!zoom) {
        zoom = d3.zoom().scaleExtent([0.85, 28]).on('zoom', onZoom);
        svg.call(zoom);
      }

      drawLayers();
      if (view) zoomTo(view.lon, view.lat, view.k);
      else svg.call(zoom.transform, d3.zoomIdentity);
      viewReady = true;
      applyVisibility();
      renderLegend();
      renderUnplaced();
      if (pinnedPersonId && personById.has(pinnedPersonId) && popupKind === 'artist') {
        const anchor = nodes.find(n => n.personId === pinnedPersonId);
        if (anchor) showArtistPopup(anchor, { keepPin: true });
      }
    }

    function onZoom(event) {
      svg.select('g').attr('transform', event.transform);
      positionScaled();
      if (popupAnchor && !popupAnchor.screen) updatePopupPosition(popupAnchor);
    }

    function drawLayers() {
      const countries = world
        ? topojson.feature(world, world.objects.countries).features
        : [];
      svg.select('.sphere').attr('d', path);
      svg.select('.graticule').attr('d', path);
      svg.select('.lands').selectAll('path').data(countries, d => d.id).join('path')
        .attr('class', 'land')
        .attr('d', path)
        .attr('stroke-width', 0.6)
        .style('vector-effect', 'non-scaling-stroke');
      svg.select('.arcs').selectAll('path').data(arcs, d => d.personId + d.d).join('path')
        .attr('class', 'arc')
        .attr('d', d => d.d)
        .attr('stroke-width', 1.25)
        .style('vector-effect', 'non-scaling-stroke');
      const nodeSel = svg.select('.nodes').selectAll('circle').data(nodes, d => d.id).join('circle')
        .attr('class', 'node')
        .attr('r', NODE_R)
        .attr('fill', d => d.color)
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .style('vector-effect', 'non-scaling-stroke')
        .on('mouseover', function(event, d) {
          hoveringNode = true;
          clearTimeout(hidePopupTimer);
          hoverPersonId = d.personId;
          applyVisibility();
          showArtistPopup(d);
        })
        .on('mouseout', function() {
          hoveringNode = false;
          hoverPersonId = null;
          applyVisibility();
          if (pinnedPersonId && popupKind === 'artist') {
            const pinned = nodes.find(n => n.personId === pinnedPersonId);
            if (pinned) showArtistPopup(pinned, { keepPin: true });
            return;
          }
          scheduleHidePopup();
        })
        .on('click', function(event, d) {
          event.stopPropagation();
          if (pinnedPersonId === d.personId && popupKind === 'artist') {
            clearFocus();
            return;
          }
          hoveringNode = true;
          pinnedPersonId = d.personId;
          tagFocus = null;
          showArtistPopup(d, { keepPin: true });
          applyVisibility();
        });
      nodeSel.append('title').text(d => d.label);

      svg.select('.node-labels').selectAll('text').data(nodes, d => d.id).join('text')
        .attr('class', 'node-label')
        .text(d => d.label);

      svg.select('.country-labels').selectAll('text').data(countryMarks, d => d.id).join('text')
        .attr('class', 'country-label');

      svg.on('click', () => { clearFocus(); });
    }

    function positionScaled() {
      const k = d3.zoomTransform(svg.node()).k || 1;
      svg.selectAll('.node').attr('r', NODE_R / k);
      svg.selectAll('.node-label')
        .attr('x', d => d.x)
        .attr('y', d => d.y + (NODE_R + 11) / k)
        .attr('font-size', 11 / k)
        .attr('stroke-width', 3 / k);
      layoutCountryLabels();
    }

    function layoutCountryLabels() {
      const t = d3.zoomTransform(svg.node());
      const k = t.k || 1;
      const font = 12;
      const placed = [];
      const visible = new Set();
      const marks = countryMarks.map(mark => {
        const count = nodes.filter(n => n.countryId === mark.id && shown(personById.get(n.personId))).length;
        return { ...mark, count, text: mark.name + ' · ' + count };
      }).filter(m => m.count > 0).sort((a, b) => b.count - a.count);

      marks.forEach(mark => {
        const x = mark.x * k + t.x;
        const y = mark.y * k + t.y - 14;
        const w = mark.text.length * font * 0.56 + 10;
        const h = font + 6;
        const box = { x: x - w / 2, y: y - h, w, h };
        const hit = placed.some(p => !(box.x + box.w < p.x || p.x + p.w < box.x || box.y + box.h < p.y || p.y + p.h < box.y));
        if (!hit) {
          placed.push(box);
          visible.add(mark.id);
        }
      });
      const byId = new Map(marks.map(m => [m.id, m]));
      svg.selectAll('.country-label')
        .attr('x', d => d.x)
        .attr('y', d => d.y - 14 / k)
        .attr('font-size', font / k)
        .attr('stroke-width', 4 / k)
        .text(d => {
          const mark = byId.get(d.id);
          return mark ? mark.text : '';
        })
        .attr('display', d => visible.has(d.id) ? null : 'none');
    }

    function applyVisibility() {
      recomputeMatchCount();
      const activeCountries = new Set();
      nodes.forEach(node => {
        if (shown(personById.get(node.personId))) activeCountries.add(node.countryId);
      });
      svg.selectAll('.land').attr('fill', d => {
        const id = d.id == null ? '' : String(parseInt(d.id, 10));
        return activeCountries.has(id) ? '#5C4F52' : '#463C3F';
      });
      svg.selectAll('.node')
        .attr('opacity', d => opacityFor(d))
        .attr('stroke', d => (d.personId === pinnedPersonId || d.personId === hoverPersonId) ? HIGHLIGHT : 'none')
        .attr('stroke-width', d => (d.personId === pinnedPersonId || d.personId === hoverPersonId) ? 2 : 0)
        .style('pointer-events', d => opacityFor(d) === 0 ? 'none' : 'all');
      svg.selectAll('.node').filter(d => d.personId === hoverPersonId || d.personId === pinnedPersonId).raise();
      svg.selectAll('.arc').attr('opacity', arcOpacity).attr('stroke-width', d => (d.personId === hoverPersonId || d.personId === pinnedPersonId) ? 2.2 : 1.25);
      const k = (zoom && svg.node()) ? (d3.zoomTransform(svg.node()).k || 1) : 1;
      svg.selectAll('.node-label')
        .attr('opacity', d => {
          if (opacityFor(d) === 0) return 0;
          if (d.personId === hoverPersonId || d.personId === pinnedPersonId) return 1;
          if (searchQuery.trim() && shown(personById.get(d.personId)) && cachedMatchCount > 0 && cachedMatchCount <= 12) return 1;
          return k >= 6.5 ? 0.95 : 0;
        });
      layoutCountryLabels();
    }

    function renderLegend() {
      const counts = new Map();
      people.forEach(person => {
        const key = getPrimaryRoleKey(person);
        counts.set(key, (counts.get(key) || 0) + 1);
      });
      const items = ROLE_PRIORITY.filter(key => counts.has(key)).map(key => {
        return '<span class="legend-item"><span class="legend-swatch" style="background:' + ROLE_PERSON_COLORS[key] + '"></span>' + escapeHtml(key) + '</span>';
      }).join('');
      const liveClass = statusError ? 'legend-live error' : 'legend-live';
      legendEl.innerHTML = '<span class="legend-count">' + people.length + ' people</span>' + items + '<span class="' + liveClass + '">' + escapeHtml(statusText) + '</span>';
    }

    function renderUnplaced() {
      const missing = people.filter(person => {
        if (!person.country) return true;
        return person.places.length === 0;
      });
      if (!missing.length) {
        unplacedEl.classList.remove('visible');
        unplacedEl.innerHTML = '';
        return;
      }
      unplacedEl.classList.add('visible');
      unplacedEl.innerHTML = '<div class="unplaced-title">country not on the map</div>' + missing.map(person => {
        return '<button type="button" data-person="' + escapeHtml(person.id) + '">' + escapeHtml(person.name) + '</button>';
      }).join('');
      unplacedEl.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          const person = personById.get(btn.getAttribute('data-person'));
          if (!person) return;
          pinnedPersonId = person.id;
          const rect = btn.getBoundingClientRect();
          popupAnchor = { x: rect.left + rect.width / 2, y: rect.top, screen: true };
          showArtistPopup(popupAnchor, { keepPin: true, person });
        });
      });
    }

    function renderClickableTags(category, raw) {
      const tags = splitCsvTags(raw);
      if (!tags.length) return '';
      return tags.map((tag, i) => {
        const sep = i < tags.length - 1 ? '<span class="card-sep">, </span>' : '';
        return '<span class="card-tag" data-cat="' + escapeHtml(category) + '" data-value="' + escapeHtml(tag) + '">' + escapeHtml(tag) + '</span>' + sep;
      }).join('');
    }

    function buildArtistCardHtml(artist) {
      const artisticName = artist.name || '';
      const legalName = artist.legal_name || '';
      const showLegal = legalName && legalName.trim().toLowerCase() !== artisticName.trim().toLowerCase();
      const country = artist.country || '';
      const role = formatRoleDisplay(artist.role);
      const social = (artist.social || '').trim();
      const contact = parseContactField(artist.telegram);
      const phoneContact = contact && contact.type === 'phone' ? contact : null;
      const metaParts = [];
      if (showLegal) metaParts.push(escapeHtml(legalName));
      if (country) metaParts.push(escapeHtml(country));
      let html = '<strong class="card-title">' + escapeHtml(artisticName) + '</strong>';
      if (metaParts.length) html += '<div class="card-meta">' + metaParts.join(' · ') + '</div>';
      if (role) html += '<div class="card-role">' + escapeHtml(role) + '</div>';
      if (artist.photo) html += '<img src="' + escapeHtml(artist.photo) + '" alt="" referrerpolicy="no-referrer">';
      if (artist.project) html += '<div class="card-row"><span class="label">projects:</span> ' + renderClickableTags('project', artist.project) + '</div>';
      if (artist.discipline) html += '<div class="card-row"><span class="label">disciplines:</span> ' + renderClickableTags('discipline', artist.discipline) + '</div>';
      if (artist.tools) html += '<div class="card-row"><span class="label">tools:</span> ' + renderClickableTags('tools', artist.tools) + '</div>';
      if (artist.instruments) html += '<div class="card-row"><span class="label">instruments:</span> ' + renderClickableTags('instruments', artist.instruments) + '</div>';
      if (artist['skill set']) html += '<div class="card-row"><span class="label">skill set:</span> ' + renderClickableTags('skill set', artist['skill set']) + '</div>';
      if (phoneContact) html += '<div class="telegram-row">' + phoneContact.label + ' <a class="telegram-link" href="' + escapeHtml(phoneContact.href) + '">' + escapeHtml(phoneContact.display) + '</a></div>';
      if (social) html += '<a class="connect-btn" href="' + escapeHtml(social) + '" target="_blank" rel="noopener noreferrer">Connect</a>';
      return html;
    }

    function curatorsForProject(projectName) {
      return people.filter(person => {
        if (!(person.tags.project && person.tags.project.has(projectName))) return false;
        return roleKeys(person).includes('curator');
      }).map(person => ({ id: person.id, name: person.name }))
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    function buildProjectCardHtml(projectName) {
      const curators = curatorsForProject(projectName);
      let html = '<strong class="card-title">' + escapeHtml(projectName) + '</strong>';
      if (curators.length) {
        const links = curators.map((curator, index) => {
          const separator = index < curators.length - 1 ? '<span class="card-sep">, </span>' : '';
          return '<span class="curator-link" role="button" tabindex="0" data-artist-id="' + escapeHtml(curator.id) + '">' + escapeHtml(curator.name) + '</span>' + separator;
        }).join('');
        html += '<div class="card-row"><span class="label">curators:</span> ' + links + '</div>';
      }
      return html;
    }

    function bindPopupInteractions() {
      if (popupWrap.dataset.bound === '1') return;
      popupWrap.dataset.bound = '1';
      popupWrap.addEventListener('mouseenter', () => {
        hoveringPopup = true;
        clearTimeout(hidePopupTimer);
      });
      popupWrap.addEventListener('mouseleave', () => {
        hoveringPopup = false;
        scheduleHidePopup();
      });
    }

    function scheduleHidePopup() {
      clearTimeout(hidePopupTimer);
      hidePopupTimer = setTimeout(() => {
        if (hoveringPopup || hoveringNode) return;
        hidePopup();
      }, 80);
    }

    function hidePopup() {
      clearTimeout(hidePopupTimer);
      popupWrap.classList.remove('active');
      popupEl.style.display = 'none';
      popupEl.classList.remove('popup-artist', 'popup-feature', 'popup-project');
      if (!pinnedPersonId) popupAnchor = null;
    }

    function showPopupWrap() {
      popupEl.style.display = 'block';
      popupWrap.classList.add('active');
    }

    function updatePopupPosition(anchor) {
      if (!anchor) return;
      let x;
      let y;
      if (anchor.screen) {
        x = anchor.x;
        y = anchor.y;
      } else if (anchor.x == null || anchor.y == null) {
        return;
      } else {
        const t = d3.zoomTransform(svg.node());
        x = anchor.x * t.k + t.x;
        y = anchor.y * t.k + t.y;
      }
      const w = popupEl.offsetWidth || 240;
      const h = popupEl.offsetHeight || 160;
      let left = x + 14;
      let top = y + 14;
      if (left + w > window.innerWidth - 12) left = x - w - 14;
      if (top + h > window.innerHeight - 12) top = Math.max(12, y - h - 14);
      if (left < 8) left = 8;
      if (top < 8) top = 8;
      popupWrap.style.left = (left - 50) + 'px';
      popupWrap.style.top = (top - 50) + 'px';
    }

    function bindCardActions(personNode) {
      popupEl.querySelectorAll('.card-tag').forEach(el => {
        el.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          const cat = el.getAttribute('data-cat');
          const value = el.getAttribute('data-value');
          if (!cat || !value) return;
          tagFocus = { cat, value };
          pinnedPersonId = null;
          popupKind = cat === 'project' ? 'project' : 'feature';
          popupEl.classList.remove('popup-artist', 'popup-feature', 'popup-project');
          popupEl.classList.add(popupKind === 'project' ? 'popup-project' : 'popup-feature');
          popupEl.innerHTML = popupKind === 'project'
            ? buildProjectCardHtml(value)
            : '<div><strong>' + escapeHtml(value) + '</strong></div>';
          showPopupWrap();
          updatePopupPosition(personNode);
          if (popupKind === 'project') bindCuratorLinks();
          applyVisibility();
        });
      });
      popupEl.querySelectorAll('a').forEach(el => {
        el.addEventListener('click', (event) => event.stopPropagation());
      });
      popupEl.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => { img.remove(); });
      });
    }

    function bindCuratorLinks() {
      popupEl.querySelectorAll('.curator-link').forEach(el => {
        const open = (event) => {
          event.preventDefault();
          event.stopPropagation();
          const artistId = el.getAttribute('data-artist-id');
          focusPerson(artistId);
        };
        el.addEventListener('click', open);
        el.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') open(event);
        });
      });
    }

    function showArtistPopup(anchor, options) {
      const opts = options || {};
      const person = opts.person || personById.get(anchor.personId);
      if (!person) return;
      bindPopupInteractions();
      clearTimeout(hidePopupTimer);
      hoveringNode = true;
      popupAnchor = anchor;
      popupKind = 'artist';
      popupEl.classList.add('popup-artist');
      popupEl.classList.remove('popup-feature', 'popup-project');
      popupEl.innerHTML = buildArtistCardHtml(person);
      showPopupWrap();
      updatePopupPosition(anchor);
      bindCardActions(anchor);
    }

    function focusPerson(personId) {
      const person = personById.get(personId);
      const node = nodes.find(n => n.personId === personId);
      if (!person || !node) return;
      tagFocus = null;
      pinnedPersonId = personId;
      hoverPersonId = personId;
      showArtistPopup(node, { keepPin: true });
      applyVisibility();
      const t = d3.zoomTransform(svg.node());
      const x = node.x * t.k + t.x;
      const y = node.y * t.k + t.y;
      const margin = 90;
      if (x < margin || y < margin || x > width - margin || y > height - margin) {
        const dx = width / 2 - x;
        const dy = height / 2 - y;
        svg.transition().duration(450).call(zoom.transform, t.translate(dx, dy));
      }
    }

    function clearFocus() {
      pinnedPersonId = null;
      hoverPersonId = null;
      hoveringNode = false;
      tagFocus = null;
      searchInput.value = '';
      searchQuery = '';
      hidePopup();
      applyVisibility();
    }

    function buildFilters() {
      const options = {};
      FILTER_ORDER.forEach(cat => { options[cat] = new Set(); });
      people.forEach(person => {
        FILTER_ORDER.forEach(cat => {
          (person.tags[cat] || new Set()).forEach(v => { if (v) options[cat].add(v); });
        });
      });
      const previous = {};
      FILTER_ORDER.forEach(cat => { previous[cat] = new Set(selectedFilters[cat] || []); });
      selectedFilters = {};
      filtersEl.innerHTML = '';
      FILTER_ORDER.forEach(cat => {
        const values = Array.from(options[cat] || []).sort((a, b) => a.localeCompare(b));
        if (!values.length) return;
        selectedFilters[cat] = new Set(Array.from(previous[cat] || []).filter(v => options[cat].has(v)));
        const group = document.createElement('div');
        group.className = 'filter-group';
        const h3 = document.createElement('h3');
        h3.textContent = cat;
        group.appendChild(h3);
        const opts = document.createElement('div');
        opts.className = 'filter-options';
        values.forEach(val => {
          const tag = document.createElement('button');
          tag.type = 'button';
          tag.className = 'filter-tag';
          tag.textContent = cat === 'role' ? formatRoleDisplay(val) : val;
          const active = selectedFilters[cat].has(val);
          tag.classList.toggle('active', active);
          tag.setAttribute('aria-pressed', String(active));
          tag.addEventListener('click', () => {
            const pressed = tag.getAttribute('aria-pressed') === 'true';
            tag.setAttribute('aria-pressed', String(!pressed));
            tag.classList.toggle('active', !pressed);
            if (pressed) selectedFilters[cat].delete(val);
            else selectedFilters[cat].add(val);
            applyVisibility();
          });
          opts.appendChild(tag);
        });
        group.appendChild(opts);
        filtersEl.appendChild(group);
      });
    }

    function resetFilters() {
      Object.keys(selectedFilters).forEach(cat => selectedFilters[cat].clear());
      filtersEl.querySelectorAll('.filter-tag').forEach(tag => {
        tag.classList.remove('active');
        tag.setAttribute('aria-pressed', 'false');
      });
      clearFocus();
    }

    function setPeople(list) {
      people = list;
      personById = new Map(people.map(p => [p.id, p]));
      buildFilters();
    }

    function sheetUrl(callbackName) {
      const tqx = callbackName
        ? encodeURIComponent('out:json;responseHandler:' + callbackName)
        : encodeURIComponent('out:json');
      return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID
        + '/gviz/tq?tqx=' + tqx
        + '&headers=1&sheet=' + encodeURIComponent(SHEET_NAME)
        + '&_=' + Date.now();
    }

    function parseGviz(text) {
      const start = text.indexOf('{');
      const end = text.lastIndexOf('}');
      if (start < 0 || end < start) throw new Error('sheet');
      const data = JSON.parse(text.slice(start, end + 1));
      if (!data || data.status !== 'ok') throw new Error('sheet');
      return data;
    }

    function fetchSheet() {
      return fetch(sheetUrl()).then(res => {
        if (!res.ok) throw new Error('sheet');
        return res.text();
      }).then(parseGviz).catch(() => new Promise((resolve, reject) => {
        let done = false;
        const cb = 'hosqSheetLoad';
        const script = document.createElement('script');
        const timer = setTimeout(() => finish(() => reject(new Error('timeout'))), 20000);
        function finish(fn) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          script.remove();
          fn();
        }
        window[cb] = (resp) => finish(() => {
          if (!resp || resp.status !== 'ok') reject(new Error('sheet'));
          else resolve(resp);
        });
        script.onerror = () => finish(() => reject(new Error('network')));
        script.src = sheetUrl(cb);
        document.head.appendChild(script);
      }));
    }

    function fetchWorld() {
      return fetch(WORLD_URL).then(r => {
        if (!r.ok) throw new Error('map');
        return r.json();
      }).then(topo => {
        world = topo;
        featureById = new Map();
        topojson.feature(topo, topo.objects.countries).features.forEach(feature => {
          if (feature.id == null) return;
          featureById.set(String(parseInt(feature.id, 10)), feature);
        });
      });
    }

    async function refresh(initial) {
      if (refreshing) return;
      refreshing = true;
      try {
        const resp = await fetchSheet();
        refreshing = false;
        if (!initial && resp.sig && resp.sig === lastSig) return;
        lastSig = resp.sig || null;
        const next = parseSheet(resp);
        if (!next.length) throw new Error('empty');
        setPeople(next);
        statusText = 'live';
        statusError = false;
        renderMap({ keepView: !initial });
      } catch (err) {
        refreshing = false;
        statusError = true;
        statusText = initial ? 'could not load the spreadsheet' : 'could not refresh';
        renderLegend();
        if (initial) legendEl.innerHTML = '<span class="legend-live error">' + escapeHtml(statusText) + '</span>';
      }
    }

    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value || '';
      applyVisibility();
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
      svg.transition().duration(250).call(zoom.scaleBy, 1.4);
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.4);
    });
    document.getElementById('zoom-fit').addEventListener('click', () => {
      svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
    });

    window.addEventListener('resize', () => {
      if (!people.length || !projection) return;
      renderMap({ keepView: true });
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refresh(false);
    });

    const logo = document.querySelector('.header-logo');
    logo.addEventListener('error', () => { logo.style.display = 'none'; });

    fetchWorld().catch(() => { world = null; }).finally(() => {
      refresh(true);
      refreshTimer = setInterval(() => refresh(false), POLL_MS);
    });
  </script>
</body>
</html>
